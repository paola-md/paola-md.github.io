<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="AI or Human? Students rate identical feedback labelled as AI or human">
<title>AI or Human? Students rate identical feedback labelled as AI or human</title>
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="#8287c7"/></marker>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#fbfaff"/><stop offset="52%" stop-color="#f4f1fb"/><stop offset="100%" stop-color="#eef4fb"/></linearGradient>
 <linearGradient id="br" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#9075c0"/><stop offset="50%" stop-color="#7173c8"/><stop offset="100%" stop-color="#6e94cf"/></linearGradient>
</defs>
<rect width="1200" height="520" fill="url(#bg)"/>
<text x="60" y="62" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#0f172a">AI or Human?</text><text x="60" y="88" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="14.5" fill="#64748b">Does knowing who wrote the feedback change how students judge it?</text><rect x="60" y="138" width="250" height="104" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="60" y="138" width="4.5" height="104" rx="2.2" fill="#9075c0"/><text x="185.0" y="181.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Student work</text><text x="185.0" y="204.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="12.5" fill="#64748b">higher education cohort</text><line x1="318" y1="190" x2="372" y2="190" stroke="#8287c7" stroke-width="2.2" marker-end="url(#ah)"/><rect x="380" y="122" width="392" height="200" rx="15" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/><text x="576" y="144" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#64748b" letter-spacing="1.3">SAME FEEDBACK, TWO LABELS</text><rect x="400" y="160" width="170" height="68" rx="13" fill="#f7f8fb" stroke="#e2e8f0" stroke-width="1.5"/><rect x="400" y="160" width="4.5" height="68" rx="2.2" fill="#6e94cf"/><text x="485.0" y="194.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Human-written</text><rect x="582" y="160" width="170" height="68" rx="13" fill="#f7f8fb" stroke="#e2e8f0" stroke-width="1.5"/><rect x="582" y="160" width="4.5" height="68" rx="2.2" fill="#fbc132"/><text x="667.0" y="194.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">AI-generated</text><text x="576" y="264" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="13.5" fill="#334155">rated blind, then with the provider revealed</text><line x1="780" y1="190" x2="834" y2="190" stroke="#8287c7" stroke-width="2.2" marker-end="url(#ah)"/><rect x="842" y="138" width="298" height="104" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="842" y="138" width="4.5" height="104" rx="2.2" fill="#7173c8"/><text x="991.0" y="181.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Perception shifts</text><text x="991.0" y="204.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="12.5" fill="#64748b">objectivity · usefulness ·</text><text x="991.0" y="219.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="12.5" fill="#64748b">genuineness</text><rect x="60" y="358" width="1080" height="62" rx="12" fill="rgba(144,117,192,.10)" stroke="#e2e8f0"/><text x="600" y="396" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" font-style="italic" fill="#5c5470">The label attached to feedback moves the rating &#8212; not only the feedback itself.</text>
</svg>
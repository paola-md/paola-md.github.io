<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Memoire: RAG-based personalised support for reflective writing">
<title>Memoire: RAG-based personalised support for reflective writing</title>
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="#8287c7"/></marker>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#fbfaff"/><stop offset="52%" stop-color="#f4f1fb"/><stop offset="100%" stop-color="#eef4fb"/></linearGradient>
 <linearGradient id="br" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#9075c0"/><stop offset="50%" stop-color="#7173c8"/><stop offset="100%" stop-color="#6e94cf"/></linearGradient>
</defs>
<rect width="1200" height="500" fill="url(#bg)"/>
<text x="60" y="62" font-family="Georgia,'Times New Roman',serif" font-size="27" fill="#0f172a">Memoire</text><text x="60" y="88" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="14.5" fill="#64748b">Retrieval-augmented, personalised support for reflective writing</text><rect x="60" y="142" width="260" height="112" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="60" y="142" width="4.5" height="112" rx="2.2" fill="#9075c0"/><text x="190.0" y="188.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">The learner’s own</text><text x="190.0" y="208.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">past reflections</text><line x1="328" y1="198" x2="382" y2="198" stroke="#8287c7" stroke-width="2.2" marker-end="url(#ah)"/><text x="355.0" y="189.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="12" font-weight="600" fill="#7173c8">retrieve</text><rect x="390" y="142" width="240" height="112" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="390" y="142" width="4.5" height="112" rx="2.2" fill="#7173c8"/><text x="510.0" y="188.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Most similar</text><text x="510.0" y="208.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">earlier entries</text><line x1="638" y1="198" x2="692" y2="198" stroke="#8287c7" stroke-width="2.2" marker-end="url(#ah)"/><rect x="700" y="142" width="200" height="112" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="700" y="142" width="4.5" height="112" rx="2.2" fill="#6e94cf"/><text x="800.0" y="198.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Current draft</text><line x1="908" y1="198" x2="962" y2="198" stroke="#8287c7" stroke-width="2.2" marker-end="url(#ah)"/><rect x="970" y="142" width="170" height="112" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="970" y="142" width="4.5" height="112" rx="2.2" fill="#fbc132"/><text x="1055.0" y="188.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">Context-aware</text><text x="1055.0" y="208.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="15" font-weight="600" fill="#0f172a">suggestion</text><path d="M1055 254 L1055 310 L190 310 L190 254" fill="none" stroke="#5c5470" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ah)"/><text x="622" y="332" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Inter','Helvetica Neue',system-ui,sans-serif" font-size="13" font-weight="600" fill="#5c5470">each new reflection becomes retrieval context for the next</text><text x="600" y="386" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="17" font-style="italic" fill="#5c5470">Suggestions grounded in what this learner has written before, not in a generic corpus.</text>
</svg>